# Temporary one-time setup; remove this workflow and its guard after success.
name: One-time Sonar main branch rename

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/sonar-main-rename.yml]

permissions:
  contents: read

jobs:
  visibility:
    if: >-
      github.event.number == 10 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.SONAR_MAIN_RENAME_SETUP == 'pr-10-once'
    runs-on: ubuntu-latest
    steps:
      - name: Verify identity and rename only the unanalysed main branch
        shell: python3 -I {0}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RUNNER_DEBUG: '0'
        run: |
          # BEGIN SONAR_MAIN_RENAME
          import json, os, urllib.error, urllib.parse, urllib.request

          HOST = 'https://sonarcloud.io'
          PROJECT = 'spatial-typestate'
          ORGANIZATION = 'telemetryworks'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Sonar main rename redirect forbidden')

          def request(method, endpoint, token=None):
              allowed = {('GET', '/api/components/show'), ('GET', '/api/project_branches/list'), ('POST', '/api/project_branches/rename')}
              if (method, endpoint) not in allowed:
                  raise RuntimeError('Sonar main rename endpoint forbidden')
              data = None
              url = HOST + endpoint
              if method == 'GET':
                  url += '?' + urllib.parse.urlencode({'component' if endpoint == '/api/components/show' else 'project': PROJECT})
              else:
                  data = urllib.parse.urlencode({'project': PROJECT, 'name': 'main'}).encode('ascii')
              headers = {'Accept': 'application/json'}
              if token is not None:
                  headers['Authorization'] = 'Bearer ' + token
              if data is not None:
                  headers['Content-Type'] = 'application/x-www-form-urlencoded'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(req, timeout=30) as response:
                      status = response.status
                      body = response.read(1024 * 1024 + 1)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise RuntimeError('Sonar main rename HTTP ' + str(error.code) + ': grant Project administer, or rename the Sonar main branch to main') from None
                  raise RuntimeError('Sonar main rename HTTP ' + str(error.code) + ' at ' + endpoint) from None
              except (OSError, urllib.error.URLError):
                  raise RuntimeError('Sonar main rename transport failed at ' + endpoint) from None
              if status not in (200, 204) or len(body) > 1024 * 1024:
                  raise RuntimeError('Sonar main rename invalid response at ' + endpoint)
              if method == 'POST':
                  return status, None
              try:
                  result = json.loads(body)
              except (ValueError, UnicodeError):
                  raise RuntimeError('Sonar main rename invalid JSON') from None
              return status, result

          def main_name(response):
              branches = response.get('branches', [])
              if len(branches) != 1 or branches[0].get('isMain') is not True:
                  raise RuntimeError('Sonar main rename unexpected branches or conflict')
              branch = branches[0]
              if branch.get('name') not in ('master', 'main'):
                  raise RuntimeError('Sonar main rename unexpected main name')
              if branch['name'] == 'master' and branch.get('analysisDate'):
                  raise RuntimeError('Sonar main rename refuses analysed master')
              return branch['name']

          def setup(call, token):
              status, response = call('GET', '/api/components/show', None)
              component = response.get('component', {})
              if component.get('key') != PROJECT or component.get('organization') != ORGANIZATION or component.get('qualifier') != 'TRK' or component.get('visibility') != 'public':
                  raise RuntimeError('Sonar main rename identity mismatch')
              statuses = [status]
              status, response = call('GET', '/api/project_branches/list', None)
              statuses.append(status)
              before = main_name(response)
              action = 'already main; no mutation'
              if before == 'master':
                  status, _ = call('POST', '/api/project_branches/rename', token)
                  statuses.append(status)
                  action = 'renamed main branch'
              status, response = call('GET', '/api/project_branches/list', None)
              statuses.append(status)
              if status != 200 or main_name(response) != 'main':
                  raise RuntimeError('Sonar main rename public verification failed')
              return {'before_main': before, 'action': action, 'after_main': 'main', 'http_statuses': statuses}

          if __name__ == '__main__':
              token = os.environ.pop('SONAR_TOKEN', '')
              if not token:
                  raise RuntimeError('Sonar main rename token absent')
              record = json.dumps(setup(request, token), sort_keys=True)
              if token in record:
                  raise RuntimeError('Sonar main rename output rejected')
              print(record)
          # END SONAR_MAIN_RENAME
