# Temporary one-time setup; remove this workflow and its guard after success.
name: One-time Sonar public visibility setup

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/sonar-visibility-setup.yml]

permissions:
  contents: read

jobs:
  visibility:
    if: >-
      github.event.number == 10 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.SONAR_VISIBILITY_SETUP == 'pr-10-once'
    runs-on: ubuntu-latest
    steps:
      - name: Verify identity and make only this private project public
        shell: python3 -I {0}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RUNNER_DEBUG: '0'
        run: |
          # BEGIN SONAR_VISIBILITY
          import json, os, urllib.error, urllib.parse, urllib.request

          HOST = 'https://sonarcloud.io'
          PROJECT = 'spatial-typestate'
          ORGANIZATION = 'telemetryworks'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Sonar visibility redirect forbidden')

          def request(method, endpoint, token=None):
              allowed = {('GET', '/api/components/show'), ('POST', '/api/projects/update_visibility')}
              if (method, endpoint) not in allowed:
                  raise RuntimeError('Sonar visibility endpoint forbidden')
              data = None
              url = HOST + endpoint
              if method == 'GET':
                  url += '?' + urllib.parse.urlencode({'component': PROJECT})
              else:
                  data = urllib.parse.urlencode({'project': PROJECT, 'visibility': 'public'}).encode('ascii')
              headers = {'Accept': 'application/json'}
              if token is not None:
                  headers['Authorization'] = 'Bearer ' + token
              if data is not None:
                  headers['Content-Type'] = 'application/x-www-form-urlencoded'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(req, timeout=30) as response:
                      status = response.status
                      body = response.read(1024 * 1024 + 1)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise RuntimeError('Sonar visibility HTTP ' + str(error.code) + ': grant Project administer, or switch visibility in Sonar settings') from None
                  raise RuntimeError('Sonar visibility HTTP ' + str(error.code) + ' at ' + endpoint) from None
              except (OSError, urllib.error.URLError):
                  raise RuntimeError('Sonar visibility transport failed at ' + endpoint) from None
              if status not in (200, 204) or len(body) > 1024 * 1024:
                  raise RuntimeError('Sonar visibility invalid response at ' + endpoint)
              if method == 'POST':
                  return status, None
              try:
                  result = json.loads(body)
              except (ValueError, UnicodeError):
                  raise RuntimeError('Sonar visibility invalid JSON') from None
              return status, result

          def identity(response):
              component = response.get('component', {})
              if component.get('key') != PROJECT or component.get('organization') != ORGANIZATION or component.get('qualifier') != 'TRK':
                  raise RuntimeError('Sonar visibility identity mismatch')
              visibility = component.get('visibility')
              if visibility not in ('private', 'public'):
                  raise RuntimeError('Sonar visibility missing or unexpected')
              return visibility

          def setup(call, token):
              status, component = call('GET', '/api/components/show', token)
              before = identity(component)
              statuses = [status]
              action = 'already public; no mutation'
              if before == 'private':
                  status, _ = call('POST', '/api/projects/update_visibility', token)
                  statuses.append(status)
                  action = 'set public'
              status, component = call('GET', '/api/components/show', token)
              statuses.append(status)
              if identity(component) != 'public':
                  raise RuntimeError('Sonar visibility authenticated verification failed')
              status, component = call('GET', '/api/components/show', None)
              statuses.append(status)
              if status != 200 or identity(component) != 'public':
                  raise RuntimeError('Sonar visibility public verification failed')
              return {'before_visibility': before, 'action': action, 'after_visibility': 'public', 'http_statuses': statuses}

          if __name__ == '__main__':
              token = os.environ.pop('SONAR_TOKEN', '')
              if not token:
                  raise RuntimeError('Sonar visibility token absent')
              # Public visibility exposes all issue/hotspot details: user-approved.
              record = json.dumps(setup(request, token), sort_keys=True)
              if token in record:
                  raise RuntimeError('Sonar visibility output rejected')
              print(record)
          # END SONAR_VISIBILITY
