name: Offline release verification fixture
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify committed provenance and SBOM with networking disabled
        run: |
          gh --version
          sudo unshare --net -- python3 -I .github/scripts/release_pypi.py verify-permissions
