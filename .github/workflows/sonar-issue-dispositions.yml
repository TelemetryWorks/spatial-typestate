# Temporary owner-authorized dispositions; remove after verified success.
name: One-time Sonar issue dispositions

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/sonar-issue-dispositions.yml]

permissions:
  contents: read

jobs:
  dispositions:
    if: >-
      github.event.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.SONAR_ISSUE_DISPOSITIONS == 'three-2026-11-08-once'
    runs-on: ubuntu-latest
    steps:
      - name: Apply only the three owner-approved issue decisions
        shell: python3 -I {0}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RUNNER_DEBUG: '0'
        run: |
          # BEGIN SONAR_DISPOSITIONS
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request

          HOST = 'https://sonarcloud.io'
          PROJECT = 'spatial-typestate'
          ORGANIZATION = 'telemetryworks'
          REVIEWED_MAIN = '318562fecb0086776cefa4390b2e3390910d95cb'
          SPECS = {
              'AaG4bQRmnDi6kOcnr-BC': {
                  'rule': 'pythonsecurity:S8705', 'component': 'spatial-typestate:scripts/performance_study.py',
                  'line': 158, 'hash': 'af333de5ec727572c9b64de003d8c1c4',
                  'transition': 'falsepositive', 'target': 'FALSE_POSITIVE', 'legacy': 'FALSE-POSITIVE',
                  'comment': '2026-11-08 UTC owner-approved false positive: the leading-dash guard in scripts/performance_study.py and its argparse validation prevent a filter from becoming a Criterion option before I/O or execution. Regression tests cover --list, --sample-size=1 and -x; normal regex filters remain supported. See docs/evals/2026-11-07-sonar-main-triage.md. This decision applies only to this sanitised finding.'},
              'AaG4bQQrnDi6kOcnr-A7': {
                  'rule': 'pythonsecurity:S8707', 'component': 'spatial-typestate:python/examples/lab_workflow.py',
                  'line': 23, 'hash': '7a230f0ac4fc65dd42516ce7f684ad2a',
                  'transition': 'accept', 'target': 'ACCEPTED', 'legacy': 'WONTFIX',
                  'comment': '2026-11-08 UTC owner-approved accepted risk: --input is a read-only file chosen by a trusted local operator, with a strict CSV header checked before data use. Absolute paths and run-anywhere operation are intentional. Do not forward untrusted file choices under broader OS rights; existence/readability probing remains possible. See docs/evals/2026-11-07-sonar-main-triage.md. This is accepted operator risk, not a false positive or a sandbox guarantee.'},
              'AaG4bQO8nDi6kOcnr-Ap': {
                  'rule': 'pythonsecurity:S8707', 'component': 'spatial-typestate:python/benchmark.py',
                  'line': 178, 'hash': 'a091cb761fd2b0bf58f3172389e12f45',
                  'transition': 'accept', 'target': 'ACCEPTED', 'legacy': 'WONTFIX',
                  'comment': '2026-11-08 UTC owner-approved accepted risk: --out is an intentional arbitrary-write interface for a trusted local operator and can overwrite any file that principal may write. Do not expose it to untrusted callers or forward untrusted output paths under broader OS rights. See docs/evals/2026-11-07-sonar-main-triage.md. Preserve the documented reproduction interface; this is accepted operator risk, not a false positive or a sandbox guarantee.'}}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Sonar disposition redirect forbidden')

          def request(method, endpoint, token=None, issue=None):
              allowed = {('GET', '/api/components/show'), ('GET', '/api/project_branches/list'),
                         ('GET', '/api/issues/search'), ('GET', '/api/issues/changelog'),
                         ('POST', '/api/issues/do_transition')}
              if (method, endpoint) not in allowed:
                  raise RuntimeError('Sonar disposition endpoint forbidden')
              data = None
              if endpoint in ('/api/issues/changelog', '/api/issues/do_transition'):
                  if issue not in SPECS:
                      raise RuntimeError('Sonar disposition issue forbidden')
                  params = {'issue': issue}
              elif endpoint == '/api/issues/search':
                  params = {'issues': ','.join(SPECS), 'branch': 'main', 'ps': '100',
                            'issueStatuses': 'OPEN,CONFIRMED,FALSE_POSITIVE,ACCEPTED,FIXED',
                            'additionalFields': 'comments,transitions'}
              elif endpoint == '/api/components/show':
                  params = {'component': PROJECT}
              else:
                  params = {'project': PROJECT}
              url = HOST + endpoint
              if method == 'POST':
                  spec = SPECS[issue]
                  params.update(transition=spec['transition'], comment=spec['comment'])
                  data = urllib.parse.urlencode(params).encode('utf-8')
              else:
                  url += '?' + urllib.parse.urlencode(params)
              headers = {'Accept': 'application/json'}
              if token is not None:
                  headers['Authorization'] = 'Bearer ' + token
              if data is not None:
                  headers['Content-Type'] = 'application/x-www-form-urlencoded'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(req, timeout=30) as response:
                      status = response.status
                      body = response.read(1024 * 1024 + 1)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise RuntimeError('Sonar disposition HTTP ' + str(error.code) + ': Administer Issues permission required; no alternate credential tried') from None
                  raise RuntimeError('Sonar disposition HTTP ' + str(error.code) + ' at ' + endpoint) from None
              except (OSError, ValueError, urllib.error.URLError):
                  raise RuntimeError('Sonar disposition transport failed at ' + endpoint) from None
              if status != 200 or len(body) > 1024 * 1024:
                  raise RuntimeError('Sonar disposition invalid response at ' + endpoint)
              try:
                  return json.loads(body)
              except (ValueError, UnicodeError):
                  raise RuntimeError('Sonar disposition invalid JSON') from None

          def snapshot(response):
              if response['paging']['total'] != 3 or response['paging']['pageIndex'] != 1:
                  raise RuntimeError('Sonar disposition incomplete exact issue set')
              found = {}
              for item in response['issues']:
                  key = item.get('key')
                  if key not in SPECS or key in found:
                      raise RuntimeError('Sonar disposition unexpected or duplicate issue')
                  spec = SPECS[key]
                  for field in ('rule', 'component', 'line', 'hash'):
                      if item.get(field) != spec[field]:
                          raise RuntimeError('Sonar disposition issue identity mismatch for ' + key)
                  if item.get('project') != PROJECT or item.get('organization') != ORGANIZATION or item.get('type') != 'VULNERABILITY' or item.get('pullRequest'):
                      raise RuntimeError('Sonar disposition project/main identity mismatch')
                  state = item.get('issueStatus')
                  if state not in ('OPEN', spec['target']):
                      raise RuntimeError('Sonar disposition unexpected modern issue status')
                  if state == spec['target'] and item.get('resolution') not in (None, spec['legacy']):
                      raise RuntimeError('Sonar disposition contradictory legacy resolution')
                  found[key] = item
              if set(found) != set(SPECS):
                  raise RuntimeError('Sonar disposition missing exact issue')
              return found

          def audit_count(item, spec):
              return sum(comment.get('markdown') == spec['comment'] for comment in item.get('comments', []))

          def transition_count(history, spec):
              return sum(any((diff.get('key') == 'issueStatus' and diff.get('newValue') == spec['target']) or
                             (diff.get('key') == 'resolution' and diff.get('newValue') == spec['legacy'])
                             for diff in event.get('diffs', [])) for event in history['changelog'])

          def apply(call, token):
              component = call('GET', '/api/components/show')['component']
              if component.get('key') != PROJECT or component.get('organization') != ORGANIZATION or component.get('visibility') != 'public' or component.get('qualifier') != 'TRK':
                  raise RuntimeError('Sonar disposition public project mismatch')
              branches = call('GET', '/api/project_branches/list')['branches']
              if len(branches) != 1 or branches[0].get('name') != 'main' or branches[0].get('isMain') is not True or branches[0].get('commit', {}).get('sha') != REVIEWED_MAIN:
                  raise RuntimeError('Sonar disposition main branch mismatch')
              before = snapshot(call('GET', '/api/issues/search'))
              authenticated = snapshot(call('GET', '/api/issues/search', token))
              histories = {}
              for key, spec in SPECS.items():
                  item = authenticated[key]
                  if item['issueStatus'] != before[key]['issueStatus']:
                      raise RuntimeError('Sonar disposition state changed during preflight')
                  histories[key] = call('GET', '/api/issues/changelog', issue=key)
                  if item['issueStatus'] == spec['target']:
                      if audit_count(item, spec) != 1 or transition_count(histories[key], spec) != 1:
                          raise RuntimeError('Sonar disposition existing target lacks approved audit')
                  elif audit_count(item, spec) or spec['transition'] not in item.get('transitions', []):
                      raise RuntimeError('Sonar disposition expected transition unavailable; Administer Issues permission required')
              changed = []
              for key, spec in SPECS.items():
                  if authenticated[key]['issueStatus'] == 'OPEN':
                      response = call('POST', '/api/issues/do_transition', token, key)
                      if response['issue'].get('key') != key or response['issue'].get('issueStatus') != spec['target']:
                          raise RuntimeError('Sonar disposition transition response mismatch')
                      changed.append(key)
              after = snapshot(call('GET', '/api/issues/search'))
              records = []
              for key, spec in SPECS.items():
                  item = after[key]
                  history = call('GET', '/api/issues/changelog', issue=key)
                  if item['issueStatus'] != spec['target'] or audit_count(item, spec) != 1 or transition_count(history, spec) != 1:
                      raise RuntimeError('Sonar disposition final status/comment/history mismatch')
                  expected_growth = 1 if key in changed else 0
                  if len(history['changelog']) != len(histories[key]['changelog']) + expected_growth:
                      raise RuntimeError('Sonar disposition unexpected history growth')
                  records.append({'issue': key, 'issueStatus': item['issueStatus'], 'legacy_resolution': item.get('resolution'),
                                  'action': 'transitioned' if key in changed else 'verified prior target',
                                  'audit_comment_sha256': hashlib.sha256(spec['comment'].encode()).hexdigest(),
                                  'matching_changelog_transitions': 1})
              return {'date_utc': '2026-11-08', 'issues': records}

          if __name__ == '__main__':
              token = os.environ.pop('SONAR_TOKEN', '')
              if not token:
                  raise RuntimeError('Sonar disposition token absent')
              record = json.dumps(apply(request, token), sort_keys=True)
              if token in record:
                  raise RuntimeError('Sonar disposition output rejected')
              print(record)
          # END SONAR_DISPOSITIONS
