name: Create committed verification fixture once

# Coordinator option (b): one explicitly dispatched branch run; no PR/tag trigger.
on:
  workflow_dispatch:

permissions: {}

jobs:
  fixture:
    if: github.repository == 'TelemetryWorks/spatial-typestate' && github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Create fixed non-release subjects without checkout
        run: |
          mkdir -p "$RUNNER_TEMP/permission-probe"
          printf '%s\n' 'TelemetryWorks token-permissions probe only; NOT a release artifact.' > "$RUNNER_TEMP/permission-probe/permission-probe.txt"
          printf '%s\n' '{"bomFormat":"CycloneDX","specVersion":"1.5","serialNumber":"urn:uuid:00000000-0000-4000-8000-000000000042","version":1,"components":[]}' > "$RUNNER_TEMP/permission-probe/permission-probe.cdx.json"
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-path: |
            ${{ runner.temp }}/permission-probe/permission-probe.txt
            ${{ runner.temp }}/permission-probe/permission-probe.cdx.json
      - id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-path: ${{ runner.temp }}/permission-probe/permission-probe.txt
          sbom-path: ${{ runner.temp }}/permission-probe/permission-probe.cdx.json
      - name: Retain bundles and public offline trust root with source identity
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "$RUNNER_TEMP/permission-probe/permission-probe.intoto.jsonl"
          cp "$SBOM" "$RUNNER_TEMP/permission-probe/permission-probe.sbom.sigstore.jsonl"
          gh attestation trusted-root > "$RUNNER_TEMP/permission-probe/permission-probe.trusted-root.jsonl"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'permission-probe'
          record = {'schema': 1, 'repository': os.environ['GITHUB_REPOSITORY'],
                    'signer_workflow': os.environ['GITHUB_REPOSITORY'] + '/.github/workflows/trusted-publishing.yml',
                    'source_ref': os.environ['GITHUB_REF'], 'source_sha': os.environ['GITHUB_SHA'],
                    'run_id': os.environ['GITHUB_RUN_ID'],
                    'gh_version': subprocess.check_output(['gh', '--version'], text=True).splitlines()[0],
                    'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir())}}
          (root / 'permission-probe.record.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: committed-permission-fixture
          path: ${{ runner.temp }}/permission-probe/
          if-no-files-found: error
          retention-days: 90
