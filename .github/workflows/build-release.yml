name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    outputs:
      rust-version:
        value: ${{ jobs.qualify.outputs.rust-version }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
  RUSTUP_TOOLCHAIN: '1.99.0'
  RELEASE_VERSION: ${{ inputs.version }}
  SPATIAL_EXPECT_COMMIT: ${{ github.sha }}
  SPATIAL_DENY_WARNINGS: '1'

defaults:
  run:
    shell: bash

jobs:
  qualify:
    permissions:
      contents: read
    uses: ./.github/workflows/qualify-release.yml # zizmor: ignore[self-repository] local immutable caller revision
    with:
      version: ${{ inputs.version }}

  sign:
    name: Sign this builder's frozen artifacts
    needs: qualify
    if: >-
      inputs.publish && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.version }}
          path: target/release-artifacts
      - name: Check own fixed payload, never a caller-selected artifact
        run: python3 -I .github/scripts/release_guard.py check
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-checksums: target/release-artifacts/SHA256SUMS
      - id: crate-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-path: target/release-artifacts/spatial-typestate-${{ inputs.version }}.crate
          sbom-path: target/release-artifacts/core.cdx.json
      - id: python-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-path: |
            target/release-artifacts/*.whl
            target/release-artifacts/*.tar.gz
          sbom-path: target/release-artifacts/python.cdx.json
      - name: Separate immutable signed sidecar (payload is never replaced)
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          CRATE_SBOM: ${{ steps.crate-sbom.outputs.bundle-path }}
          PYTHON_SBOM: ${{ steps.python-sbom.outputs.bundle-path }}
        run: |
          mkdir -p target/release-attestations
          cp "$PROVENANCE" "target/release-attestations/spatial-typestate-$RELEASE_VERSION.crates.intoto.jsonl"
          cp "$CRATE_SBOM" "target/release-attestations/spatial-typestate-$RELEASE_VERSION.crate.sbom.sigstore.jsonl"
          cp "$PYTHON_SBOM" "target/release-attestations/spatial-typestate-$RELEASE_VERSION.python.sbom.sigstore.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.version }}-attestations
          path: target/release-attestations/
          if-no-files-found: error
          retention-days: 90
