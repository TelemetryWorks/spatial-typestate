name: Frozen 0.1.0 candidate qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-0.1.0-qualification
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    name: Selected Windows wheel (Python ${{ matrix.python }})
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9974fd6a00521d631d6ff6e35d4aa936f6b624cf
          persist-credentials: false
          path: candidate-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13627490908'
          run-id: '42505032821'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-artifact
      - name: Verify selected hash and run isolated installed consumers
        run: python -I tooling/.github/scripts/candidate_qualification.py windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualified-windows-${{ matrix.python }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-candidate/
          if-no-files-found: warn
          retention-days: 30

  crate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9974fd6a00521d631d6ff6e35d4aa936f6b624cf
          persist-credentials: false
          path: candidate-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
      - name: Verify actual crate and unpacked std/no_std consumers
        run: python -I tooling/.github/scripts/candidate_qualification.py crate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualified-crate-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-candidate/
          if-no-files-found: warn
          retention-days: 30
