# Temporary one-time setup; remove this workflow and its guard after success.
name: One-time Sonar new-code baseline setup

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/sonar-baseline-setup.yml]

permissions:
  contents: read

jobs:
  baseline:
    if: >-
      github.event.number == 12 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.SONAR_BASELINE_SETUP == 'date-2026-11-07-once'
    runs-on: ubuntu-latest
    steps:
      - name: Configure only the fixed deployment baseline
        shell: python3 -I {0}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RUNNER_DEBUG: '0'
        run: |
          # BEGIN SONAR_BASELINE
          import json, os, urllib.error, urllib.parse, urllib.request

          HOST = 'https://sonarcloud.io'
          PROJECT = 'spatial-typestate'
          ORGANIZATION = 'telemetryworks'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Sonar baseline redirect forbidden')

          TARGET = {'sonar.leak.period': '2026-11-07', 'sonar.leak.period.type': 'date'}

          def request(method, endpoint, token=None, key=None):
              allowed = {('GET', '/api/components/show'), ('GET', '/api/project_branches/list'),
                         ('GET', '/api/settings/values'), ('POST', '/api/settings/set')}
              if (method, endpoint) not in allowed:
                  raise RuntimeError('Sonar baseline endpoint forbidden')
              data = None
              if method == 'POST':
                  if key not in TARGET:
                      raise RuntimeError('Sonar baseline setting forbidden')
                  data = urllib.parse.urlencode({'component': PROJECT, 'key': key, 'value': TARGET[key]}).encode('ascii')
                  url = HOST + endpoint
              else:
                  params = {'project': PROJECT}
                  if endpoint == '/api/components/show':
                      params = {'component': PROJECT}
                  elif endpoint == '/api/settings/values':
                      params = {'component': PROJECT, 'keys': ','.join(TARGET)}
                  url = HOST + endpoint + '?' + urllib.parse.urlencode(params)
              headers = {'Accept': 'application/json'}
              if token is not None:
                  headers['Authorization'] = 'Bearer ' + token
              if data is not None:
                  headers['Content-Type'] = 'application/x-www-form-urlencoded'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(req, timeout=30) as response:
                      status = response.status
                      body = response.read(1024 * 1024 + 1)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise RuntimeError('Sonar baseline HTTP ' + str(error.code) + ': Project administer permission required') from None
                  raise RuntimeError('Sonar baseline HTTP ' + str(error.code) + ' at ' + endpoint) from None
              except (OSError, urllib.error.URLError):
                  raise RuntimeError('Sonar baseline transport failed at ' + endpoint) from None
              if status not in (200, 204) or len(body) > 1024 * 1024:
                  raise RuntimeError('Sonar baseline invalid response at ' + endpoint)
              if method == 'POST':
                  return status, None
              try:
                  result = json.loads(body)
              except (ValueError, UnicodeError):
                  raise RuntimeError('Sonar baseline invalid JSON') from None
              return status, result

          def settings(response):
              state = {}
              for item in response['settings']:
                  key = item['key']
                  if key not in TARGET or key in state or not isinstance(item.get('value'), str):
                      raise RuntimeError('Sonar baseline unexpected settings')
                  state[key] = item['value']
              return state

          def setup(call, token):
              status, response = call('GET', '/api/components/show', None)
              component = response.get('component', {})
              if component.get('key') != PROJECT or component.get('organization') != ORGANIZATION or component.get('qualifier') != 'TRK' or component.get('visibility') != 'public':
                  raise RuntimeError('Sonar baseline identity mismatch')
              statuses = [status]
              status, response = call('GET', '/api/project_branches/list', None)
              statuses.append(status)
              branches = response.get('branches', [])
              if len(branches) != 1 or branches[0].get('isMain') is not True or branches[0].get('name') != 'main':
                  raise RuntimeError('Sonar baseline main branch mismatch')
              status, response = call('GET', '/api/settings/values', token)
              statuses.append(status)
              before = settings(response)
              action = 'already exact target; no mutation'
              if before == {}:
                  for key in TARGET:  # Fixed documented order: date value, then date type.
                      status, _ = call('POST', '/api/settings/set', token, key)
                      statuses.append(status)
                  action = 'set fixed deployment date'
              elif before != TARGET:
                  raise RuntimeError('Sonar baseline existing foreign or partial setting; no overwrite')
              status, response = call('GET', '/api/settings/values', token)
              statuses.append(status)
              if settings(response) != TARGET:
                  raise RuntimeError('Sonar baseline verification failed')
              return {'baseline_date': '2026-11-07', 'baseline_type': 'date', 'action': action, 'http_statuses': statuses}

          if __name__ == '__main__':
              token = os.environ.pop('SONAR_TOKEN', '')
              if not token:
                  raise RuntimeError('Sonar baseline token absent')
              record = json.dumps(setup(request, token), sort_keys=True)
              if token in record:
                  raise RuntimeError('Sonar baseline output rejected')
              print(record)
          # END SONAR_BASELINE
