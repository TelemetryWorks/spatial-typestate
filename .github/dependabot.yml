version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Owner policy 2026-11-16: plan major version updates deliberately.
    # This update-types rule does not suppress security-update PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Owner policy 2026-11-16: plan major version updates deliberately.
    # This update-types rule does not suppress security-update PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /python/native
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Owner policy 2026-11-16: plan major version updates deliberately.
    # This update-types rule does not suppress security-update PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      native-minor-patch:
        update-types: [minor, patch]
