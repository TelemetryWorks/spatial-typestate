[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "spatial-typestate"
version = "0.1.0"
description = "Checked, frame-tagged spatial batches backed by Rust"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "spatial_typestate._native"
features = ["pyo3/extension-module"]
